name: Generate Ambient Gallery

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contribution-gallery source
        uses: actions/checkout@v4
        with:
          repository: crosscore/contribution-gallery
          path: gallery

      - name: Install and build
        working-directory: gallery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ../dist
          npm install
          npx tsx src/cli.ts --user byananya --mode ambient --out ../dist/ambient.svg
          npx tsx src/cli.ts --user byananya --mode ambient --dark --out ../dist/ambient-dark.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
