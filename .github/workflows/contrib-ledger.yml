name: Contribution Ledger

on:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/contrib_graph.py"
      - "scripts/streak_card.py"
      - ".github/workflows/contrib-ledger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVGs
        env:
          # METRICS_TOKEN (PAT) includes private contributions; falls back to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/contrib_graph.py --user byananya --out assets
          python scripts/streak_card.py --user byananya --out assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "Update contribution ledger [skip ci]"
          git push
